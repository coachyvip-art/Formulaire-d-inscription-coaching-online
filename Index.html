<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche d'inscription – Coaching sportif en ligne</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f4;--card:#fff;--ink:#0b0f1a;--mute:#566074;--line:#d8dce5;--acc:#e8390b;--accink:#fff;--hi:#ffe14a;--hiink:#0b0f1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--card:#141b2d;--ink:#f2f4f8;--mute:#9ba5ba;--line:#27324d;--acc:#ff6a3d;--accink:#0b0f1a;--hi:#ffe14a;--hiink:#0b0f1a}}
:root[data-theme="dark"]{--bg:#0b0f1a;--card:#141b2d;--ink:#f2f4f8;--mute:#9ba5ba;--line:#27324d;--acc:#ff6a3d;--accink:#0b0f1a;--hi:#ffe14a;--hiink:#0b0f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{position:relative;overflow:hidden;background:#0b0f1a;color:#fff;padding:30px 16px 0;margin:0 -16px 22px}
header:after{content:"";position:absolute;top:0;bottom:0;right:4%;width:7%;background:#e8390b;box-shadow:-20px 0 0 #ffe14a,-40px 0 0 #fff;transform:skewX(-18deg)}
header>div{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-right:20%}
h1{font:700 clamp(40px,12vw,76px)/.9 "Barlow Condensed",Impact,sans-serif;margin:0 0 14px;text-transform:uppercase;transform:skewX(-8deg);transform-origin:left}
h1 b{display:block;color:#ffe14a}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.tags span{background:#e8390b;color:#fff;font-weight:600;font-size:14px;padding:4px 10px;transform:skewX(-8deg)}
.ph{position:relative;z-index:1;display:block;width:calc(100% + 32px);margin:0 -16px;max-height:460px;object-fit:contain;background:#000;border-bottom:6px solid #e8390b}
.phw{position:relative;z-index:1;display:flex;align-items:center;width:calc(100% + 32px);margin:0 -16px;background:#000;border-bottom:6px solid #e8390b}
.phw .ph{width:100%;height:auto;flex:1 1 auto;min-width:0;margin:0;border:0;max-height:none;aspect-ratio:auto;object-fit:contain}
.logo{flex:0 0 30%;display:flex;align-items:center;justify-content:center;padding:6px}
.logo img{display:block;max-width:100%;height:auto}
.coach a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.coach{position:relative;z-index:1;margin:0 -16px;background:#ffe14a;color:#0b0f1a;font-weight:600;padding:12px 16px}
.coach div{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:2px 22px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;margin-bottom:14px}
h2{font:700 26px/1.1 "Barlow Condensed",Impact,sans-serif;margin:0 0 14px;text-transform:uppercase;letter-spacing:.02em;padding-left:12px;border-left:6px solid var(--acc)}
section{border-top:4px solid var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:14px;font-weight:600;color:var(--mute)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chips span{display:block;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:500;background:var(--bg)}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.lead{font-size:14px;font-weight:600;color:var(--mute);margin:0 0 8px}
#imc{margin:12px 0 0;font-weight:600}
.ok{display:flex;gap:10px;align-items:flex-start}
.ok input{margin-top:5px;width:20px;height:20px;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
button{font:600 17px Barlow,sans-serif;padding:14px 20px;border-radius:8px;border:2px solid var(--acc);cursor:pointer;flex:1 1 220px}
.send{background:var(--acc);color:var(--accink)}
.alt{background:transparent;color:var(--acc)}
#msg{margin-top:10px;font-weight:600;min-height:1.4em}
@media print{.actions,#msg{display:none}body{background:#fff;color:#000}section{break-inside:avoid}}
</style>
</head>

function fld(a){var id=a[0],h='<label class="f'+(a[2]=="textarea"?' full':'')+'">'+a[1];
if(a[2]=="select")h+='<select id="'+id+'"><option value="">Choisir</option>'+a[3].map(function(o){return'<option>'+o+'</option>'}).join('')+'</select>';
else if(a[2]=="textarea")h+='<textarea id="'+id+'" placeholder="'+(a[3]||'')+'"></textarea>';
else h+='<input id="'+id+'" type="'+a[2]+'"'+(a[2]=="number"?' inputmode="decimal" min="0"':'')+(a[3]?' placeholder="'+a[3]+'"':'')+'>';
return h+'</label>'}

var html=S.map(function(s,i){
var h='<section><h2>'+s.t+'</h2>';
if(s.chips){h+='<p class="lead">'+s.lead+'</p><div class="chips" data-g="'+s.t+'">'+s.chips.map(function(c){return'<label><input type="checkbox" value="'+c+'"><span>'+c+'</span></label>'}).join('')+'</div>'}

function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function imc(){var p=parseFloat(v('poids')),t=parseFloat(v('taille'))/100,o=document.getElementById('imc');
if(p>0&&t>0){var x=p/(t*t);var c=x<18.5?'insuffisance pondérale':x<25?'poids normal':x<30?'surpoids':'obésité';o.textContent='IMC : '+x.toFixed(1)+' ('+c+')';return x.toFixed(1)}o.textContent='';return''}
['poids','taille'].forEach(function(i){document.getElementById(i).addEventListener('input',imc)});

function build(){var L=["*FICHE D'INSCRIPTION – COACHING EN LIGNE*",""];
S.forEach(function(s){L.push("*"+s.t+"*");
if(s.chips){var g=document.querySelector('[data-g="'+s.t+'"]'),c=[].slice.call(g.querySelectorAll('input:checked')).map(function(i){return i.value});

s.f.forEach(function(a){L.push(a[1].replace(', facultatif','').replace(' (facultatif)','')+" : "+(v(a[0])||'-'))});
if(s.id=="mes"){var x=imc();if(x)L.push("IMC : "+x)}
L.push("")});return L.join("\n")}
